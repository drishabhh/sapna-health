name: CI probe
on:
  push:
    branches: [android-app]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe ok" > probe.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-probe
          name: CI probe
          prerelease: true
          files: probe.txt
